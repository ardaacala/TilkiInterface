island-level:
  placeholder: '%superior_island_level_format%'
sidebar:
  enabled: true
  use-tilkitags: true
  # Başka bir pluginin sidebar'ı varsa zorla değiştirme.
  respect-existing: true
  title: '&6&lTILKI&f&lCRAFT'
  footer: '&6TilkiCraft &8• &fSkyblock'
  rank-placeholder: '%luckperms_prefix%'
  rank-fallback: '&fOyuncu'
  # İstersen örn. %superior_island_level% yaz; ilgili PAPI expansion gerekir.
  island-placeholder: ''
  lines:
    - '&7{date}'
    - ' '
    - '{icon-online} &fÇevrimiçi &7» &e{online}/{max}'
    - '{icon-ping} &fPing &7» &e{ping} ms'
    - ' '
    - '{icon-player} &fOyuncu &7» &f{player}'
    - '{icon-rank} &fRütbe &7» {rank}'
    - '{icon-money} &fBakiye &7» &e{money}'
    - '{icon-island} &fAda Seviyesi &7» &e{island-level}'
    - ' '
    - '{icon-time} &fSüre &7» &e{playtime}'
    - ' '
    - '{icon-fox} {footer}'
tab:
  enabled: true
  # frame: oyuncu sayısına göre büyüyen orman çerçevesi (TilkiTags gerekir); text: düz başlık/alt bilgi.
  style: frame
  # auto: sunucu online-mode ise oyuncu kafaları için 9 px eklenir. true/false ile zorlanabilir.
  show-heads: auto
  # Başlıklar krem rengi kalın; &#RRGGBB hex renk desteklenir.
  title: '&#FFE9C2&lSKYBLOCK'
  online: '&fÇevrimiçi: &a{online} &8/ &f{max}'
  # Alt tabeladaki tek satır (yaklaşık 115 px sığar).
  links: '&6/discord &8• &6/kurallar'
top-bar:
  enabled: true
  text: '&6◆ &f{money} &8┃ {rank} &8┃ &6TilkiCraft &8┃ &f{online}/{max}'
pack:
  url: 'https://github.com/ardaacala/TilkiInterface/releases/download/v1.6.0/TilkiInterface-ResourcePack.zip'
  sha1: 'c274118744ab3ca09cf448f2cd4bb83834462066'
  required: false
  delay-ticks: 100
  prompt: 'TilkiCraft logo ve menü temasını yükle.'
